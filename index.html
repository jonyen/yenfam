<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <title>The Yen Family</title>
  <meta name="description" content="The Yen family photo album.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yenfam.com/">
  <meta property="og:site_name" content="yenfam.com">
  <meta property="og:title" content="The Yen Family">
  <meta property="og:description" content="The Yen family photo album.">
  <meta property="og:image" content="https://yenfam.com/hero/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="900">
  <meta property="og:image:alt" content="The Yen family together at the beach">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #faf8f5; --fg: #2b2622; --muted: #8a7f76; --card: #fff; --shadow: rgba(0,0,0,.08);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171513; --fg: #ece6df; --muted: #9a9087; --card: #221f1c; --shadow: rgba(0,0,0,.4); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    header { text-align: center; padding: 24px 16px; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2rem, 6vw, 3.2rem); margin: 0; }
    header p { color: var(--muted); margin: 6px 0 0; }
    main { max-width: 1400px; margin: 0 auto; padding: 0 16px 64px; }
    h2 { font-family: Georgia, serif; font-weight: 400; font-size: 1.4rem; margin: 40px 0 12px; }
    .grid { columns: 4 260px; column-gap: 12px; }
    .grid button { display: block; width: 100%; margin: 0 0 12px; padding: 0; border: 0; background: var(--card);
      border-radius: 8px; overflow: hidden; cursor: zoom-in; box-shadow: 0 1px 3px var(--shadow); break-inside: avoid; }
    .grid img { display: block; width: 100%; height: auto; transition: transform .3s; }
    .grid button:hover img { transform: scale(1.02); }
    .empty { text-align: center; color: var(--muted); padding: 80px 16px; }
    #placeholder { display: none; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 24px 16px; }
    /* The picture takes whatever height the title leaves, so picture + title fill the screen with no scroll.
       It never gets so tall that the crop cuts the family off at the sides (tall phones). */
    .top { display: flex; flex-direction: column; height: 100vh; height: 100svh; }
    .top > header, .top > #placeholder { flex: none; margin-bottom: auto; }
    .hero { flex: 1 1 0; min-height: 0; max-height: 121vw; }
    .hero-frame { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .hero-frame img, .hero-frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .hero-frame img { object-fit: cover; object-position: 50% 75%; }
    .hero-frame canvas { opacity: 0; transition: opacity .8s; }
    .hero-frame canvas.live { opacity: 1; }
    body.waiting header, body.waiting main { display: none; }
    body.waiting #placeholder { display: flex; }
    #placeholder h1 { margin-bottom: 12px; }
    #placeholder p { color: var(--muted); margin: 0; max-width: 32ch; }
    #placeholder small { color: var(--muted); opacity: .7; margin-top: 20px; letter-spacing: .08em; text-transform: uppercase; font-size: .72rem; }
    dialog { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh; }
    dialog::backdrop { background: rgba(10,9,8,.94); }
    .lb { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 16px; }
    .lb img { max-width: 100%; max-height: calc(100vh - 80px); object-fit: contain; border-radius: 4px; }
    .lb figcaption { color: #cfc6bd; margin-top: 10px; font-size: .9rem; min-height: 1.4em; }
    .nav { position: fixed; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.12); color: #fff;
      border: 0; width: 48px; height: 48px; border-radius: 50%; font-size: 24px; cursor: pointer; }
    .nav:hover { background: rgba(255,255,255,.25); }
    .prev { left: 16px; } .next { right: 16px; }
    .close { position: fixed; top: 16px; right: 16px; background: none; border: 0; color: #fff; font-size: 32px; cursor: pointer; }
  </style>
</head>
<body class="waiting">
  <div class="top">
  <section class="hero">
    <div class="hero-frame">
      <img id="hero-img" src="hero/beach.jpg" width="2048" height="1536" alt="The Yen family together at the beach">
      <canvas id="hero-live" aria-hidden="true"></canvas>
    </div>
  </section>

  <section id="placeholder">
    <h1>The Yen Family</h1>
    <p>Our family photo album is on its way. Check back soon.</p>
    <small>yenfam.com</small>
  </section>

  <header>
    <h1>The Yen Family</h1>
    <p>Moments worth keeping</p>
  </header>
  </div>
  <main id="gallery"></main>

  <dialog id="lightbox">
    <figure class="lb">
      <img id="lb-img" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="nav prev" aria-label="Previous">‹</button>
    <button class="nav next" aria-label="Next">›</button>
    <button class="close" aria-label="Close">×</button>
  </dialog>

  <script>
    const gallery = document.getElementById('gallery');
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbCap = document.getElementById('lb-cap');
    let photos = [];
    let current = 0;

    function groupLabel(p) {
      return p.album || (p.date ? p.date.slice(0, 4) : 'Photos');
    }

    function render() {
      if (!photos.length) return;
      document.body.classList.remove('waiting');
      const groups = new Map();
      photos.forEach((p, i) => {
        const key = groupLabel(p);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(i);
      });
      gallery.innerHTML = '';
      for (const [label, idxs] of groups) {
        const h = document.createElement('h2');
        h.textContent = label;
        const grid = document.createElement('div');
        grid.className = 'grid';
        for (const i of idxs) {
          const p = photos[i];
          const b = document.createElement('button');
          const img = document.createElement('img');
          img.src = 'photos/thumb/' + p.file;
          img.alt = p.caption || '';
          img.loading = 'lazy';
          if (p.w && p.h) { img.width = p.w; img.height = p.h; }
          b.appendChild(img);
          b.addEventListener('click', () => open(i));
          grid.appendChild(b);
        }
        gallery.append(h, grid);
      }
    }

    function show(i) {
      current = (i + photos.length) % photos.length;
      const p = photos[current];
      lbImg.src = 'photos/full/' + p.file;
      lbImg.alt = p.caption || '';
      lbCap.textContent = [p.caption, p.date].filter(Boolean).join(' · ');
    }
    function open(i) { show(i); lb.showModal(); }

    lb.querySelector('.prev').onclick = () => show(current - 1);
    lb.querySelector('.next').onclick = () => show(current + 1);
    lb.querySelector('.close').onclick = () => lb.close();
    lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('lb')) lb.close(); });
    document.addEventListener('keydown', e => {
      if (!lb.open) return;
      if (e.key === 'ArrowLeft') show(current - 1);
      if (e.key === 'ArrowRight') show(current + 1);
    });

    // Living hero: clouds drift, swells roll in and foam laps the shore. hero/beach-mask.png marks
    // where each motion applies, with the family left at zero so they hold still.
    (function liveHero() {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const canvas = document.getElementById('hero-live');
      const gl = canvas.getContext('webgl', { premultipliedAlpha: false });
      if (!gl) return;
      // crop is the share of the picture that fits the screen, so the canvas fills it like object-fit: cover.
      // The leftover is trimmed mostly off the sky (75% down, as in the img's object-position) to keep the feet.
      const vs = `attribute vec2 p; uniform vec2 crop; varying vec2 uv;
        void main() { uv = vec2(p.x, -p.y) * .5 * crop + .5 + (1. - crop) * vec2(0., .25); gl_Position = vec4(p, 0., 1.); }`;
      const fs = `precision highp float;
        uniform sampler2D img, mask, clean; uniform float t; varying vec2 uv;
        const float LOOP = 16.;
        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
          return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + 1.), f.x), f.y);
        }
        float fbm(vec2 p) { return noise(p) * .6 + noise(p * 2.1 + 7.) * .3 + noise(p * 4.3 + 3.) * .1; }
        // Shore wash: rushes up the sand quickly, then slides back slowly. x is 0..1 through one lap.
        float wash(float x) { return x < .3 ? smoothstep(0., .3, x) : 1. - smoothstep(.3, 1., x); }
        void main() {
          vec3 m = texture2D(mask, uv).rgb;
          float skyW = m.r * step(uv.y, .5), shoreW = m.r * step(.5, uv.y);
          // Everything runs off one phase, so the motion repeats exactly every LOOP seconds.
          float a = t * 6.2831853 / LOOP;
          vec2 orbit = vec2(cos(a), sin(a));
          // Clouds: slow billowing plus a gentle back-and-forth drift.
          vec2 sky = vec2(fbm(uv * 3. + orbit * .5) - .5, fbm(uv * 3. + vec2(5., 0.) + orbit.yx * .4) - .5) * .014
                   + vec2(sin(a) * .004, 0.);
          vec3 col = texture2D(img, uv + sky * skyW).rgb;
          // Sea: swells keep rolling toward the beach. Two copies slide shoreward half a cycle apart
          // and cross-fade, so the motion never runs out (8 cycles per loop).
          float depth = smoothstep(.44, .65, uv.y);
          vec2 wob = vec2(fbm(uv * 10. + orbit * 1.2) - .5, 0.) * .006;
          float jitter = fbm(uv * 4.) * .6;
          float p0 = fract(t * 8. / LOOP + jitter), p1 = fract(p0 + .5);
          vec2 flow = vec2(.002, -.035) * (.3 + depth);
          vec3 s0 = texture2D(img, uv + (flow * (p0 - .5) + wob) * m.g).rgb;
          vec3 s1 = texture2D(img, uv + (flow * (p1 - .5) + wob) * m.g).rgb;
          col = mix(col, mix(s0, s1, abs(p0 - .5) * 2.), step(.001, m.g));
          // Shore: lift the foam off a foam-free plate and wash it up the sand and back (4 laps per loop).
          if (shoreW > .001) {
            float lap = wash(fract(t * 4. / LOOP + uv.x * .25));
            vec2 q = uv + vec2(0., .03 * (1. - lap)) * smoothstep(.62, .8, uv.y);
            float foam = texture2D(mask, q).b * (.55 + .45 * lap);
            vec3 base = texture2D(clean, uv).rgb;
            col = mix(col, mix(base, texture2D(img, q).rgb, foam), shoreW);
          }
          gl_FragColor = vec4(col, 1.);
        }`;
      function shader(type, src) {
        const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh); return sh;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      const tLoc = gl.getUniformLocation(prog, 't');
      const cropLoc = gl.getUniformLocation(prog, 'crop');

      function texture(unit, name, im) {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, im);
        gl.uniform1i(gl.getUniformLocation(prog, name), unit);
      }
      function load(src) {
        return new Promise((ok, fail) => { const im = new Image(); im.onload = () => ok(im); im.onerror = fail; im.src = src; });
      }

      let visible = true;
      new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(canvas);

      Promise.all(['hero/beach.jpg', 'hero/beach-mask.png', 'hero/beach-clean.jpg'].map(load)).then(([im, mask, clean]) => {
        texture(0, 'img', im);
        texture(1, 'mask', mask);  // r sky (top) / shore zone (bottom), g sea, b shore foam
        texture(2, 'clean', clean);
        const start = performance.now();
        function frame(now) {
          requestAnimationFrame(frame);
          if (!visible || document.hidden) return;
          const dpr = Math.min(devicePixelRatio || 1, 2);
          const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
          if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h);
            const r = (w / h) / (im.width / im.height);
            gl.uniform2f(cropLoc, Math.min(1, r), Math.min(1, 1 / r));
          }
          gl.uniform1f(tLoc, ((now - start) / 1000) % 16);  // matches LOOP in the shader
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          canvas.classList.add('live');
        }
        requestAnimationFrame(frame);
      }).catch(() => {});
    })();

    fetch('photos.json', { cache: 'no-cache' })
      .then(r => r.json())
      .then(data => { photos = data; render(); })
      .catch(() => {});
  </script>
</body>
</html>
